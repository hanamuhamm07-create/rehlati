<!DOCTYPE html>
<html lang="ar" dir="rtl" data-accent="violet" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060F">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رحلتي">
<title>رحلتي الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08060F;--s1:#110D1C;--s2:#191328;--s3:#231A38;--line:#2C2345;
  --v:#8B5CF6;--v2:#A78BFA;--v3:#CDBFFC;--vd:#5B33C9;--vg:rgba(139,92,246,.16);
  --tx:#F5F2FB;--mut:#B1A9C6;--dim:#8F86A8;
  --ok:#6FD3B0;--warm:#F0B866;--bad:#F58A9A;
  --r1:26px;--r2:18px;--r3:12px;
  --ui:'Readex Pro','SF Arabic','Geeza Pro','Segoe UI',system-ui,sans-serif;
  --serif:'Amiri','Geeza Pro','Noto Naskh Arabic',serif;
  --hh:64px;--vvh:100dvh;
}
[data-accent=indigo]{--v:#6D7CFF;--v2:#9AA5FF;--v3:#C9CEFF;--vd:#3F4CC9;--vg:rgba(109,124,255,.16)}
[data-accent=orchid]{--v:#B565F0;--v2:#CD94F6;--v3:#E5C8FB;--vd:#8A32C9;--vg:rgba(181,101,240,.16)}
[data-accent=lilac]{--v:#9F8BE8;--v2:#BBAEF0;--v3:#DDD6F8;--vd:#6C58BF;--vg:rgba(159,139,232,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-text-size-adjust:100%}
html[data-size=s]{font-size:16px}html[data-size=l]{font-size:19.5px}
body{background:var(--bg);color:var(--tx);font-family:var(--ui);line-height:1.7;direction:rtl;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(900px 420px at 90% -90px,var(--vg),transparent 70%);background-repeat:no-repeat}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
svg.i{width:1.4em;height:1.4em;flex:none;display:block}
:focus-visible{outline:2px solid var(--v2);outline-offset:2px;border-radius:8px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.sp{flex:1}
.mut{color:var(--mut)}.dim{color:var(--dim)}.sm{font-size:.86rem}.xs{font-size:.78rem}
.serif{font-family:var(--serif)}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:rgba(8,6,15,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hdr-in{height:var(--hh);display:flex;align-items:center;gap:6px;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.5rem;font-weight:700;padding:6px 8px;border-radius:14px}
.brand svg{width:34px;height:34px}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--mut);transition:background .2s,color .2s;flex:none}
.icon-btn:hover,.icon-btn[aria-expanded=true]{background:var(--s3);color:var(--tx)}
.icon-btn.sm{width:42px;height:42px}
.pill{display:flex;align-items:center;gap:9px;padding:0 16px;height:44px;border-radius:99px;background:var(--s3);border:1px solid var(--line);font-weight:500}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.pill.run .dot{animation:pulse 1.6s infinite}
.pill.pause .dot{background:var(--warm)}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* menu */
#menu-root .scrim{position:fixed;inset:0;z-index:40;background:rgba(4,2,10,.5)}
.menu{position:fixed;z-index:41;top:calc(var(--hh) + env(safe-area-inset-top) - 4px);left:max(12px,env(safe-area-inset-left));width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - var(--hh) - 24px - env(safe-area-inset-top));overflow:auto;background:var(--s2);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.6);transform-origin:top left;animation:menuIn .18s ease-out}
@keyframes menuIn{from{opacity:0;transform:scale(.94) translateY(-6px)}}
.menu button{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 14px;border-radius:14px;font-weight:400}
.menu button svg{color:var(--v2)}
.menu button:hover{background:var(--s3)}
.menu button.on{background:var(--vg);color:var(--v3);font-weight:500}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 8px}

/* layout */
.page{max-width:1120px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));outline:0}
h1{font-family:var(--serif);font-size:2.1rem;line-height:1.3;font-weight:700;margin-bottom:6px}
h2{font-size:1.1rem;font-weight:500}
h3{font-size:1rem;font-weight:500}
.sub{color:var(--mut);margin-bottom:18px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph>div:first-child{flex:1;min-width:200px}.ph .sub{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr))}
.cols{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:920px){.cols.c2{grid-template-columns:1.12fr .88fr}.cols.c2b{grid-template-columns:.9fr 1.1fr}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r1);padding:22px;min-width:0}
.card>h2{margin-bottom:12px}
.card.tight{padding:14px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rule{border:0;border-top:1px solid var(--line);margin:16px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:16px;font-weight:500;background:var(--s3);border:1px solid var(--line);transition:transform .12s,background .2s;white-space:nowrap;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--v),var(--vd));border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px var(--v)}
.btn.soft{background:var(--vg);border-color:transparent;color:var(--v3)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(245,138,154,.14);border-color:transparent;color:var(--bad)}
.btn.lg{min-height:64px;font-size:1.15rem;padding:0 34px;border-radius:20px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.lnk{color:var(--v2);text-decoration:underline;text-underline-offset:4px;padding:6px 2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-size:.9rem;color:var(--mut)}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=time],input[type=number],input[type=datetime-local],select,textarea{width:100%;min-height:52px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--tx);appearance:none;-webkit-appearance:none;font-size:1rem}
input[type=date],input[type=datetime-local],input[type=time]{text-align:right}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:18px 52%,24px 52%;background-size:6px 6px;background-repeat:no-repeat;padding-left:42px}
textarea{resize:vertical;min-height:84px;line-height:1.7}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--v);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;padding:0 14px;border-radius:12px;color:var(--mut);text-align:center;white-space:nowrap}
.seg button.on{background:var(--v);color:#fff;font-weight:500}
.switch{position:relative;width:56px;height:32px;flex:none;border-radius:99px;background:var(--s3);border:1px solid var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
.switch.on{background:var(--v);border-color:transparent}
.switch.on::after{transform:translateX(-24px);background:#fff}
.opt{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-height:60px}
.opt:last-child{border-bottom:0}
.opt>div:first-child{flex:1;min-width:0}
.opt .d{color:var(--dim);font-size:.85rem;line-height:1.5}
.opt select,.opt input[type=number]{width:auto;min-width:130px}
.err{color:var(--bad);font-size:.92rem;min-height:1.4em}
.hint{color:var(--dim);font-size:.85rem}
.strength{height:6px;border-radius:9px;background:var(--s3);overflow:hidden;margin-top:6px}
.strength i{display:block;height:100%;width:0;background:var(--bad);transition:width .25s,background .25s}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:99px;background:var(--s2);border:1.5px solid var(--line);color:var(--mut)}
.chip.sel.on{border-color:var(--c,var(--v));color:var(--tx);background:color-mix(in srgb,var(--c,var(--v)) 20%,var(--s2))}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:1px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--dim)) 18%,transparent);color:var(--tx)}
.mchip.late{background:rgba(240,184,102,.15);color:var(--warm)}
.sbadge{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c,var(--v)) 24%,var(--s2));flex:none}
.sbadge.sm{width:38px;height:38px;font-size:1.15rem;border-radius:12px}

/* hero (home) */
.hero{border-radius:30px;padding:26px;background:linear-gradient(160deg,var(--s3),var(--s1) 70%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero .dt{font-family:var(--serif);font-size:2.3rem;line-height:1.25;font-weight:700}
.hero .hj{color:var(--dim);margin-top:2px}
.quote{font-family:var(--serif);font-size:1.45rem;line-height:1.85;margin:20px 0 6px;color:var(--v3);min-height:3.4em}
.quote-row{display:flex;gap:6px;align-items:flex-start}
.quote-row .quote{flex:1}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px}
.tile b{display:block;font-size:1.45rem;font-weight:500;line-height:1.3;color:var(--tx)}
.tile span{color:var(--mut);font-size:.88rem}
.tile.acc{background:var(--vg);border-color:transparent}
.bar{height:10px;background:var(--s3);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vd),var(--v2));border-radius:9px;transition:width .5s}
.empty{padding:26px 16px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:var(--r2)}
.empty b{display:block;color:var(--tx);font-weight:500;margin-bottom:4px}
.empty .btn{margin-top:12px}
.empty-s{color:var(--mut);padding:8px 0}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r2);background:rgba(240,184,102,.1);border:1px solid rgba(240,184,102,.25);color:#F6D9A8;margin-bottom:16px}
.banner .sp{min-width:10px}
.banner.info{background:var(--vg);border-color:transparent;color:var(--v3)}

/* tasks */
.trow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;color:#fff;margin:0 4px;transition:all .2s;position:relative}
.chk::before{content:"";position:absolute;inset:-9px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06241A}
.chk svg{width:20px;height:20px;stroke-width:3}
.tmain{flex:1;min-width:0;display:block;padding:8px 6px;border-radius:12px}
.ttl{display:block;font-weight:400;overflow-wrap:anywhere}
.trow.done .ttl{color:var(--dim);text-decoration:line-through}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.prio{font-size:.74rem;color:var(--dim);display:inline-flex;align-items:center;gap:5px}
.prio::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dim)}
.prio.p1::before{background:var(--bad)}.prio.p2::before{background:var(--warm)}.prio.p3::before{background:var(--ok)}

/* timer */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
.ringbox{position:relative;width:min(78vw,340px);aspect-ratio:1}
.ring{width:100%;height:100%;overflow:visible}
.ring-bg{fill:none;stroke:var(--s3);stroke-width:10}
.ring-fg{fill:none;stroke:var(--v2);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear;filter:drop-shadow(0 0 10px var(--v))}
.ringbox.idle .ring-fg{opacity:0}
.ringbox.paused .ring-fg{stroke:var(--warm);filter:none}
.ringbox.run::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,var(--vg),transparent 68%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.5}}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 16%}
.ringc .clock{font-size:clamp(2.2rem,11vw,3.3rem);font-weight:300;letter-spacing:.02em;line-height:1.2}
.ringc .st{color:var(--mut);font-size:.95rem}
.ringc .sn{font-family:var(--serif);font-size:1.2rem;color:var(--v3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* lists */
.srow{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%}
.srow:last-child{border-bottom:0}
.srow .mid{flex:1;min-width:0}
.srow .t{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .m{color:var(--dim);font-size:.84rem}
.srow .dur{font-weight:500;color:var(--v3);white-space:nowrap}
button.srow{border-radius:12px}button.srow:hover{background:var(--s2)}
.dayh{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;padding:16px 4px 4px;border-bottom:1px solid var(--line)}
.sbar{display:flex;align-items:center;gap:12px;margin:10px 0}
.sbar .nm{width:34%;min-width:90px;display:flex;align-items:center;gap:8px;font-size:.92rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sbar .bar{flex:1}.sbar .bar i{background:var(--c)}
.sbar .vl{width:84px;text-align:left;font-size:.86rem;color:var(--mut)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .bgl{stroke:var(--line);stroke-width:1}
.chart rect.b{fill:var(--v);rx:5;transition:fill .15s;cursor:pointer}
.chart rect.b.z{fill:var(--s3)}
.chart rect.b.sel{fill:var(--v3)}
.chart text{fill:var(--dim);font-size:11px;font-family:var(--ui)}
.chart text.ax{font-size:10px}
.readout{min-height:1.8em;color:var(--v3);margin-top:6px;text-align:center}
.delta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhead h2{flex:1;text-align:center;font-family:var(--serif);font-size:1.6rem;font-weight:700}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cwd{text-align:center;color:var(--dim);font-size:.82rem;padding:4px 0}
.cday{position:relative;aspect-ratio:1/.96;min-height:48px;border-radius:14px;background:var(--s1);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:border-color .15s}
.cday.l1{background:rgba(139,92,246,.2);background:color-mix(in srgb,var(--v) 20%,var(--s1))}
.cday.l2{background:rgba(139,92,246,.38);background:color-mix(in srgb,var(--v) 38%,var(--s1))}
.cday.l3{background:rgba(139,92,246,.56);background:color-mix(in srgb,var(--v) 56%,var(--s1))}
.cday.l4{background:rgba(139,92,246,.8);background:color-mix(in srgb,var(--v) 80%,var(--s1))}
.cday.today{border-color:var(--v3)}
.cday.sel{border-color:var(--tx)}
.cday.empty-c{background:transparent;pointer-events:none}
.cday .n{font-size:1rem}
.cday .tk{width:6px;height:6px;border-radius:50%;background:var(--warm);position:absolute;bottom:7px}
.cday .ck{width:6px;height:6px;border-radius:50%;background:var(--ok);position:absolute;bottom:7px;right:calc(50% + 6px)}
.legend{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:.8rem;margin-top:12px;flex-wrap:wrap}
.legend i{width:18px;height:18px;border-radius:6px;display:inline-block}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;flex-wrap:wrap}
.tabs button{min-height:46px;padding:0 18px;border-radius:99px;background:var(--s1);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tabs button.on{background:var(--vg);color:var(--v3);border-color:transparent;font-weight:500}

/* stickers */
.stk{--sz:72px;width:var(--sz);height:var(--sz);border-radius:28%;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,var(--v2),var(--vd));box-shadow:0 10px 26px -8px var(--vd);flex:none;overflow:hidden}
.stk .e{font-size:calc(var(--sz)*.56);line-height:1}
.stk.img{background:none;box-shadow:none;border-radius:0;overflow:visible}
.stk img{width:100%;height:100%;object-fit:contain}
.dayhero{text-align:center;padding:30px 20px}
.dayhero .stk{margin:0 auto 14px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:0}}
.dua{font-family:var(--serif);font-size:1.7rem;line-height:2;color:var(--v3);text-align:center;padding:10px 6px}
.big-msg{font-family:var(--serif);font-size:1.5rem;line-height:1.8}

/* celebrate + toast */
.cele-root{position:fixed;inset:auto 0 calc(18px + env(safe-area-inset-bottom)) 0;z-index:95;display:flex;justify-content:center;pointer-events:none;padding:0 14px}
.cele{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--s3);border:1px solid var(--v);border-radius:24px;padding:12px 14px;max-width:460px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.6);animation:rise .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.cele-t{flex:1;display:flex;flex-direction:column;line-height:1.5;min-width:0}
.cele-t span{color:var(--mut);font-size:.9rem}
.cele .stk{--sz:60px}
.cele-spark{width:48px;height:48px;color:var(--v2);display:grid;place-items:center}
.cele-spark svg{width:34px;height:34px}
.toast-root{position:fixed;left:0;right:0;top:calc(var(--hh) + 14px + env(safe-area-inset-top));z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{background:var(--s3);border:1px solid var(--line);padding:12px 20px;border-radius:99px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:rise .3s ease-out;max-width:100%;text-align:center}

/* sheet */
.modal-root{position:fixed;inset:0;z-index:90;display:none}

}

.lm-item.off .tx{opacity:.45}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin:10px 0}
.stkcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:var(--s2)}

.stkcell .acts{display:flex;gap:2px}

/* ================= المحتوى الافتراضي ================= */
const B_QUOTES=[
'كل خطوة صغيرة تقرّبك من هدفك.','مش مطلوب منك الكمال، المطلوب منك الاستمرار.','الإنجاز مش بعدد الساعات فقط، الإنجاز في الشيء اللي فهمته وتعلمته.','ابدأ بما تستطيع، والباقي يجي خطوة بخطوة.','تعب اليوم هو جزء من بناء مستقبلك.','حتى لو كان تقدمك بطيئًا، المهم أنك لم تتوقف.','افتخر بكل مجهود بذلته، مهما كان بسيطًا.',

/* ================= التخزين والتشفير ================= */
const store=(()=>{let ok=false;const mem={};try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ok=true;}catch(e){}
  return {persistent:ok,get:k=>ok?localStorage.getItem(k):(mem[k]??null),set:(k,v)=>{ok?localStorage.setItem(k,v):(mem[k]=v);},del:k=>{ok?localStorage.removeItem(k):delete mem[k];}};})();
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hasCrypto=!!(window.crypto&&crypto.subtle);
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encJSON(obj,k){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decJSON(blob,k){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},k,unb64(blob.ct));
  return JSON.parse(dec.decode(pt));
}

const newDek=()=>crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
async function wrapDek(dek,wk){const raw=await crypto.subtle.exportKey('raw',dek),iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,raw))};}
async function unwrapDek(w,wk){const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},wk,unb64(w.ct));return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']);}
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',RITER=100000;
function genRecovery(){const u=crypto.getRandomValues(new Uint8Array(17));let bits='';u.forEach(b=>bits+=b.toString(2).padStart(8,'0'));let o='';for(let i=0;i<130;i+=5)o+=B32[parseInt(bits.slice(i,i+5),2)];return o;}
const normRec=s=>String(s||'').toUpperCase().replace(/[^A-Z2-7]/g,'');
const prettyRec=k=>k.match(/.{1,4}/g).join('-');
async function makeRecoveryWrap(dek){const rk=genRecovery(),rs=crypto.getRandomValues(new Uint8Array(16));return {rk,rsalt:b64(rs),riter:RITER,wrapRec:await wrapDek(dek,await deriveKey(rk,rs,RITER))};}

function normalizeState(s){
  const d=defaultState();const o=Object.assign({},d,s||{});
  o.settings=Object.assign({},d.settings,(s&&s.settings)||{});
  ['subjects','sessions','tasks','trash','quotes','duas','stickers'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=d[k];});
  if(!o.closures||typeof o.closures!=='object'||Array.isArray(o.closures))o.closures={};
  if(!o.recent||typeof o.recent!=='object')o.recent={};
  return o;
}
function validateState(d){
  const bad=m=>({ok:false,err:m});
  if(!d||typeof d!=='object'||Array.isArray(d))return bad('محتوى النسخة غير صالح.');
  const arr=(k)=>d[k]===undefined||Array.isArray(d[k]);
  for(const k of ['subjects','sessions','tasks','trash','quotes','duas','stickers'])if(!arr(k))return bad('بنية النسخة غير سليمة (القسم «'+k+'» تالف).');
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const nn=x=>typeof x==='number'&&isFinite(x);
  for(const s of d.subjects||[])if(!isObj(s)||typeof s.id!=='string'||typeof s.name!=='string')return bad('وُجدت مادة دراسية غير صالحة داخل النسخة.');
  for(const s of d.sessions||[])if(!isObj(s)||typeof s.id!=='string'||!nn(s.start)||!nn(s.end)||!nn(s.dur)||s.dur<0||s.end<s.start)return bad('وُجدت جلسة دراسة غير صالحة داخل النسخة.');
  for(const t of d.tasks||[])if(!isObj(t)||typeof t.id!=='string'||typeof t.title!=='string'||(t.date&&!isKey(t.date)))return bad('وُجدت مهمة غير صالحة داخل النسخة.');
  for(const t of d.trash||[])if(!isObj(t)||!isObj(t.item)||!nn(t.at)||!['session','task'].includes(t.type))return bad('عناصر سلة المحذوفات غير صالحة.');
  for(const k of ['quotes','duas'])for(const q of d[k]||[])if(!isObj(q)||typeof q.id!=='string'||typeof q.text!=='string')return bad('العبارات أو الأدعية داخل النسخة غير صالحة.');
  for(const q of d.stickers||[])if(!isObj(q)||typeof q.id!=='string'||typeof q.content!=='string'||!['emoji','image'].includes(q.type)||(q.type==='image'&&!/^data:image\/(png|jpeg|webp);base64,/.test(q.content)))return bad('الملصقات داخل النسخة غير صالحة.');
  const o=JSON.parse(JSON.stringify(d));
  if(isObj(o.closures)){for(const k of Object.keys(o.closures))if(!isKey(k)||!isObj(o.closures[k]))delete o.closures[k];}else o.closures={};
  o.timer=null;
  return {ok:true,state:normalizeState(o)};
}

/* حفظ مشفّر متسلسل */
let saveT=null,chain=Promise.resolve(),dirty=false;
function save(now){dirty=true;clearTimeout(saveT);saveT=setTimeout(()=>flush(),now?0:350);}
function flush(){
  chain=chain.then(async()=>{
    if(!state||!key||!dirty)return;dirty=false;
    try{
      const blob=await encJSON(state,key);
      store.set(VKEY,JSON.stringify(Object.assign({v:2},vaultMeta,{iv:blob.iv,ct:blob.ct})));
      if(ui.saveError){ui.saveError=false;toast('تم الحفظ بنجاح','ok');}
    }catch(e){dirty=true;if(!ui.saveError){ui.saveError=true;toast('تعذّر حفظ البيانات (قد تكون مساحة التخزين ممتلئة). صدّر نسخة احتياطية الآن.','bad');}}

}

  let pool=list.filter(x=>!rc.includes(x.id));if(!pool.length){rc.length=0;pool=list;}
  const it=pool[Math.floor(Math.random()*pool.length)];rc.push(it.id);
  const keep=Math.max(0,Math.min(list.length-1,Math.floor(list.length*.7)));while(rc.length>keep)rc.shift();

function dayStats(a){const b=addDays(a,1);const ss=sessionsIn(a,b).sort((x,y)=>x.start-y.start);const by={};ss.forEach(s=>{by[s.sub||'']=(by[s.sub||'']||0)+s.dur;});return {ss,done:doneIn(a,b),total:sum(ss,s=>s.dur),by};}

function weekStartOf(t){const d=new Date(sod(t));return addDays(sod(t),-((d.getDay()-S().weekStart+7)%7));}
function nowRanges(){
  const td=sod(Date.now()),d=new Date(td);
  return {day:[td,addDays(td,1)],week:[weekStartOf(td),addDays(weekStartOf(td),7)],month:[new Date(d.getFullYear(),d.getMonth(),1).getTime(),new Date(d.getFullYear(),d.getMonth()+1,1).getTime()],year:[new Date(d.getFullYear(),0,1).getTime(),new Date(d.getFullYear()+1,0,1).getTime()]};

function studyDaySet(){const s=new Set();state.sessions.forEach(x=>s.add(dkey(x.start)));return s;}
function streaks(){
  const set=studyDaySet();const td=sod(Date.now());
  let cur=0,c=set.has(dkey(td))?td:addDays(td,-1);while(set.has(dkey(c))){cur++;c=addDays(c,-1);}
  const keys=[...set].sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{const t=parseKey(k).getTime();run=(prev!==null&&Math.round((t-prev)/DAY)===1)?run+1:1;prev=t;best=Math.max(best,run);});
  return {cur,best};
}

function taskList(filter){
  const td=dkey(Date.now()),all=state.tasks;
  const f={today:t=>!t.done&&t.date&&t.date<=td,upcoming:t=>!t.done&&t.date&&t.date>td,nodate:t=>!t.done&&!t.date,done:t=>t.done,all:()=>true}[filter]||(()=>true);

  return filter==='done'?l.sort((a,b)=>b.doneAt-a.doneAt):l.sort(taskSort);
}

/* ================= التقارير ================= */
function periodFor(range,off){
  const td=sod(Date.now()),d=new Date(td);let a,b,label;
  if(range==='day'){a=addDays(td,off);b=addDays(a,1);label=F.full.format(a);}
  else if(range==='week'){a=addDays(weekStartOf(td),off*7);b=addDays(a,7);label=F.dm.format(a)+' – '+F.dm.format(addDays(b,-1));}
  else if(range==='month'){a=new Date(d.getFullYear(),d.getMonth()+off,1).getTime();b=new Date(d.getFullYear(),d.getMonth()+off+1,1).getTime();label=F.my.format(a);}
  else if(range==='year'){a=new Date(d.getFullYear()+off,0,1).getTime();b=new Date(d.getFullYear()+off+1,0,1).getTime();label='سنة '+(d.getFullYear()+off);}
  else{const f=ui.report.from,t=ui.report.to;if(!isKey(f)||!isKey(t)||t<f)return null;a=parseKey(f).getTime();b=addDays(parseKey(t).getTime(),1);label=F.dmy.format(a)+' – '+F.dmy.format(addDays(b,-1));}
  const days=Math.max(1,Math.round((b-a)/DAY));
  const elapsed=clamp(Math.round((Math.min(b,addDays(td,1))-a)/DAY),0,days);
  return {a,b,label,days,elapsed,range,off,ongoing:b>addDays(td,0)&&a<=td};
}
function prevPeriod(p){
  if(p.range==='month'||p.range==='year'||p.range==='week'||p.range==='day')return periodFor(p.range,p.off-1);
  const len=p.b-p.a;return {a:p.a-len,b:p.a,label:'الفترة السابقة',range:'custom',days:p.days};
}
function metrics(a,b){
  const ss=sessionsIn(a,b),total=sum(ss,s=>s.dur),days=new Set(ss.map(s=>dkey(s.start))),by={};
  ss.forEach(s=>{by[s.sub||'']=(by[s.sub||'']||0)+s.dur;});
  return {ss,total,n:ss.length,days:days.size,by,tasks:doneIn(a,b).length,longest:ss.length?Math.max(...ss.map(s=>s.dur)):0};
}
function buckets(p){
  const out=[];
  if(p.range==='day'){for(let h=0;h<24;h++)out.push({a:p.a+h*3600000,b:p.a+(h+1)*3600000,label:String(h),kind:'h'});return out;}
  if(p.range==='year'||(p.range==='custom'&&p.days>400)){let c=new Date(p.a);c=new Date(c.getFullYear(),c.getMonth(),1);while(c.getTime()<p.b){const n=new Date(c.getFullYear(),c.getMonth()+1,1);out.push({a:Math.max(c.getTime(),p.a),b:Math.min(n.getTime(),p.b),label:F.mon.format(c),kind:'m'});c=n;}return out;}
  if(p.range==='custom'&&p.days>62){let c=p.a;while(c<p.b){const n=Math.min(addDays(c,7),p.b);out.push({a:c,b:n,label:String(new Date(c).getDate()),kind:'w'});c=n;}return out;}
  for(let c=p.a;c<p.b;c=addDays(c,1))out.push({a:c,b:addDays(c,1),label:p.range==='week'?F.wds.format(c):String(new Date(c).getDate()),kind:'d'});
  return out;
}
function bucketValues(p,bk){
  const v=bk.map(()=>0);
  state.sessions.forEach(s=>{
    if(s.start<p.a||s.start>=p.b)return;
    if(p.range==='day'){const span=Math.max(1,s.end-s.start),f=s.dur/span;bk.forEach((x,i)=>{const o=Math.min(s.end,x.b)-Math.max(s.start,x.a);if(o>0)v[i]+=o*f;});}
    else{const i=bk.findIndex(x=>s.start>=x.a&&s.start<x.b);if(i>=0)v[i]+=s.dur;}
  });
  return v;
}
function barChart(bk,v){
  const W=640,H=200,pl=8,pb=26,pt=14,max=Math.max(...v,1),useH=max>=2*3600000,unit=useH?3600000:60000,top=Math.ceil(max/unit/ (useH?1:10))*(useH?1:10)*unit||unit;
  const n=bk.length,step=(W-pl*2-44)/n,bw=Math.min(step*.66,34),ch=H-pb-pt;
  let g=`<line class="bgl" x1="${pl+44}" x2="${W-pl}" y1="${pt}" y2="${pt}"/><line class="bgl" x1="${pl+44}" x2="${W-pl}" y1="${pt+ch}" y2="${pt+ch}"/><text class="ax" x="${pl+38}" y="${pt+4}" text-anchor="end">${top/unit}${useH?' س':' د'}</text><text class="ax" x="${pl+38}" y="${pt+ch+4}" text-anchor="end">0</text>`;
  const every=n>24?Math.ceil(n/12):1;
  bk.forEach((x,i)=>{const cx=W-pl-(i+.5)*step,h=v[i]>0?Math.max(3,v[i]/top*ch):2;
    g+=`<rect class="b ${v[i]>0?'':'z'} ${ui.report.sel===i?'sel':''}" data-act="bar" data-i="${i}" x="${cx-bw/2}" y="${pt+ch-h}" width="${bw}" height="${h}" rx="5"/>`;
    if(i%every===0)g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(x.label)}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني لوقت الدراسة">${g}</svg>`;
}
function bucketName(p,x){return p.range==='day'?`الساعة ${x.label}`:x.kind==='m'?F.my.format(x.a):x.kind==='w'?`أسبوع يبدأ ${F.dm.format(x.a)}`:F.full.format(x.a);}

      <div class="cols c2" style="margin-top:18px"><section class="card"><h2>${R.range==='day'?'توزيع اليوم بالساعات':'توزيع وقت الدراسة'}</h2>${barChart(bk,v)}<div class="readout" id="readout">اضغط على عمود لرؤية قيمته.</div></section>
      <section class="card"><h2>المواد التي درستها</h2>${subs.length?subs.map(x=>{const s=subj(x.id);return `<div class="sbar"><span class="nm">${s?s.icon:'📖'} ${esc(subjName(x.id))}</span><div class="bar"><i style="--c:${s?s.color:'#8F86A8'};width:${x.ms/m.total*100}%"></i></div><span class="vl">${fmtDur(x.ms)}</span></div>`;}).join(''):'<p class="mut">لا مواد.</p>'}</section></div>
      <div class="cols c2" style="margin-top:18px"><section class="card"><h2>المتوسطات</h2>

/* ================= الأرشيف ================= */
function archFilter(){
  const A=ui.arch,q=A.q.trim().toLowerCase();
  const fromT=isKey(A.from)?parseKey(A.from).getTime():-Infinity,toT=isKey(A.to)?addDays(parseKey(A.to).getTime(),1):Infinity;
  const hit=(txt)=>!q||txt.toLowerCase().includes(q);
  if(A.tab==='sessions')return state.sessions.filter(s=>s.start>=fromT&&s.start<toT&&(!A.sub||s.sub===A.sub)&&hit(`${s.title} ${s.note} ${subjName(s.sub)}`)).sort((a,b)=>b.start-a.start);
  if(A.tab==='tasks')return state.tasks.filter(t=>t.done&&t.doneAt>=fromT&&t.doneAt<toT&&(!A.sub||t.sub===A.sub)&&hit(`${t.title} ${t.desc} ${subjName(t.sub)}`)).sort((a,b)=>b.doneAt-a.doneAt);
  if(A.tab==='days')return Object.keys(state.closures).filter(k=>{const t=parseKey(k).getTime();return t>=fromT&&t<toT&&hit(state.closures[k].note||'');}).sort().reverse();
  return state.trash.slice().sort((a,b)=>b.at-a.at);
}
function archList(){const l=$('#arch-list');if(l)l.innerHTML=archListHTML();}
function archListHTML(){
  const A=ui.arch,items=archFilter(),shown=items.slice(0,A.limit);
  if(!items.length)return `<div class="empty"><b>${A.tab==='trash'?'سلة المحذوفات فارغة':'لا نتائج'}</b>${A.q||A.sub||A.from||A.to?'جرّب تغيير البحث أو التصفية.':'ستظهر السجلات هنا عند حفظها.'}</div>`;
  let h='';
  if(A.tab==='sessions'){let last='';shown.forEach(s=>{const k=dkey(s.start);if(k!==last){last=k;const tot=sum(items.filter(x=>dkey(x.start)===k),x=>x.dur);h+=`<div class="dayh"><span>${F.full.format(s.start)}</span><span>${fmtDur(tot)}</span></div>`;}h+=sessionRow(s);});}
  else if(A.tab==='tasks'){shown.forEach(t=>{h+=taskRow(t,{noDel:false})+`<div class="xs dim" style="padding:0 52px 8px">أُنجزت ${F.dtm.format(t.doneAt)}</div>`;});}
  else if(A.tab==='days'){shown.forEach(k=>{const c=state.closures[k],st=dayStats(parseKey(k).getTime());h+=`<button class="srow" data-act="nav-day" data-key="${k}"><span class="sbadge sm">🌙</span><div class="mid"><div class="t">${F.full.format(parseKey(k))}</div><div class="m">${c.note?esc(c.note.slice(0,80)):'بدون ملاحظة'}</div></div><span class="dur num">${fmtDur(st.total)}</span></button>`;});}
  else{shown.forEach(x=>{const title=x.type==='session'?`جلسة ${fmtDur(x.item.dur)} — ${esc(x.item.title||subjName(x.item.sub))}`:`مهمة: ${esc(x.item.title)}`;h+=`<div class="srow"><div class="mid"><div class="t">${title}</div><div class="m">حُذفت ${F.dtm.format(x.at)} — تُحذف نهائيًا بعد ${Math.max(0,30-Math.floor((Date.now()-x.at)/DAY))} يومًا</div></div><button class="btn soft" data-act="tr-restore" data-id="${x.id}">استعادة</button><button class="icon-btn sm" data-act="tr-purge" data-id="${x.id}" aria-label="حذف نهائي">${ic.trash}</button></div>`;});}
  if(items.length>A.limit)h+=`<div class="row" style="justify-content:center;margin:14px"><button class="btn" data-act="arch-more">عرض المزيد (${items.length-A.limit})</button></div>`;
  return h;
}
P.archive=function(){

/* ================= النسخ الاحتياطي ================= */
function download(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},3000);
}
async function exportBackup(encrypted){
  try{
    const snap=JSON.parse(JSON.stringify(state));snap.timer=null;
    const meta={app:'rehlati-study',version:1,createdAt:Date.now(),encrypted:!!encrypted};
    const out=encrypted?Object.assign(meta,{salt:vaultMeta.salt,iter:vaultMeta.iter,wrapPw:vaultMeta.wrapPw},await encJSON(snap,key)):Object.assign(meta,{data:snap});
    download(`rehlati-backup-${dkey(Date.now())}${encrypted?'-enc':''}.json`,JSON.stringify(out));
    state.settings.lastBackup=Date.now();save(true);if(ui.page==='backup'||ui.page==='home')renderMain();
    toast('تم تجهيز النسخة الاحتياطية، تحقق من ملف التنزيلات','ok');return true;
  }catch(e){toast('تعذّر إنشاء النسخة الاحتياطية','bad');return false;}
}
async function parseBackup(text){
  let o;try{o=JSON.parse(text);}catch(e){throw new Error('الملف ليس بصيغة صحيحة، تأكد أنه نسخة احتياطية من التطبيق.');}
  if(!o||o.app!=='rehlati-study')throw new Error('هذا الملف ليس نسخة احتياطية من «رحلتي الدراسية».');
  if(typeof o.version!=='number'||o.version>1)throw new Error('إصدار هذه النسخة أحدث من التطبيق الحالي ولا يمكن استيراده.');
  let data;
  if(o.encrypted){
    if(typeof o.salt!=='string'||typeof o.iv!=='string'||typeof o.ct!=='string'||!(o.iter>=1000&&o.iter<=5e6))throw new Error('ملف النسخة المشفرة تالف.');
    const pw=await askText({title:'نسخة مشفّرة',msg:'أدخل كلمة المرور التي كانت مستخدمة وقت إنشاء هذه النسخة.',label:'كلمة المرور'});
    if(pw===null)return null;
    try{const pk=await deriveKey(pw,unb64(o.salt),o.iter);data=await decJSON(o,o.wrapPw?await unwrapDek(o.wrapPw,pk):pk);}catch(e){throw new Error('كلمة المرور غير صحيحة أو أن الملف تالف.');}
  }else data=o.data;
  const v=validateState(data);if(!v.ok)throw new Error(v.err);
  return {state:v.state,createdAt:o.createdAt};
}
async function readBackupFile(file){
  if(file.size>40*1024*1024)throw new Error('حجم الملف كبير جدًا.');
  return parseBackup(await file.text());
}
async function importFlow(file){
  try{
    const r=await readBackupFile(file);if(!r)return;
    const s=r.state,c=state;
    const ok=await confirmDlg({title:'استبدال البيانات الحالية؟',
      msg:`تحتوي النسخة على <b>${num(s.sessions.length)}</b> جلسة و<b>${num(s.tasks.length)}</b> مهمة و<b>${num(s.subjects.length)}</b> مادة${r.createdAt?`، أُنشئت في ${F.dtm.format(r.createdAt)}`:''}.<br>بياناتك الحالية (${num(c.sessions.length)} جلسة و${num(c.tasks.length)} مهمة) <b>ستُستبدل بالكامل</b>.`,
      extra:`<label class="opt" style="margin-top:10px"><div>حفظ نسخة من بياناتي الحالية قبل الاستبدال</div><input type="checkbox" id="cf-bk" checked style="width:26px;height:26px"></label>`,ok:'استبدال البيانات',danger:true});
    if(!ok)return;
    if(confirmDlg.chk)await exportBackup(true);
    const lb=state.settings.lastBackup;state=s;state.settings.lastBackup=Math.max(lb||0,state.settings.lastBackup||0)||null;
    ui.quote=null;ui.daySticker={};save(true);renderAll();toast('تمت استعادة البيانات بنجاح','ok');
  }catch(e){toast(e.message||'تعذّر استيراد الملف','bad');}
}

function openMgr(kind){
  const st={arm:null,edit:null,kind};
  const title={quotes:'العبارات التحفيزية',duas:'الأدعية والأذكار',stickers:'الملصقات'}[kind];
  const draw=()=>{const b=$('#sheet-b');if(!b)return;const y=b.scrollTop;b.innerHTML=mgrBody(kind,st)+'<p class="err" id="sheet-err" role="alert"></p>';b.scrollTop=y;};
  openSheet({title,wide:true,body:mgrBody(kind,st),buttons:[{label:'تم',cls:'primary'}],onOpen:()=>{
    sheetOn(async e=>{
      const t=e.target.closest('[data-m]');if(!t)return;const a=t.dataset.m,id=t.dataset.id,list=state[kind];
      if(a!=='del')st.arm=null;
      if(a==='add'){const v=$('#m-new').value.trim();if(!v){sheetErr('اكتب النص أولًا.');return;}list.unshift({id:uid(),text:v,on:true});save();draw();}
      else if(a==='tog'){const x=list.find(z=>z.id===id);x.on=x.on===false;save();draw();}
      else if(a==='edit'){st.edit=id;draw();}
      else if(a==='cancel'){st.edit=null;draw();}
      else if(a==='save'){const v=$('#m-edit').value.trim();if(!v){sheetErr('النص فارغ.');return;}list.find(z=>z.id===id).text=v;st.edit=null;save();draw();}
      else if(a==='del'){if(st.arm===id){state[kind]=list.filter(z=>z.id!==id);st.arm=null;save();draw();}else{st.arm=id;draw();toast('اضغط مرة أخرى للتأكيد');}}
      else if(a==='restore'){const base=kind==='quotes'?B_QUOTES.map((x,i)=>({id:'q'+i,text:x})):kind==='duas'?B_DUAS.map((x,i)=>({id:'d'+i,text:x})):B_STK.map((x,i)=>({id:'s'+i,type:'emoji',content:x}));
        let n=0;base.forEach(x=>{if(!list.some(z=>z.id===x.id)){list.push(Object.assign(x,{on:true}));n++;}});save();draw();toast(n?`أُعيد ${n} عنصر`:'لا عناصر محذوفة لاستعادتها');}
      else if(a==='add-emo'){const v=$('#m-emo').value.trim();if(!v){sheetErr('اكتب رمزًا تعبيريًا.');return;}list.push({id:uid(),type:'emoji',content:v,on:true});save();draw();}
      else if(a==='add-img'){$('#m-img').click();$('#m-img').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const d=await readImage(f);list.push({id:uid(),type:'image',content:d,on:true});save(true);draw();toast('تمت إضافة الملصق','ok');}catch(x){sheetErr('تعذّر قراءة الصورة، جرّب ملفًا آخر.');}};}
    });}});
}
function readImage(file,max=200){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpeg|webp)$/.test(file.type))return rej(new Error('type'));
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'));};img.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

function strengthOf(p){let s=0;if(p.length>=6)s++;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z\u0600-\u06FF]/.test(p)&&/[A-Z0-9\W]/.test(p))s++;if(/\d/.test(p)&&/\D/.test(p)&&p.length>=8)s++;return s;}
function busy(on,label){const b=$('#g-go');if(!b)return;b.disabled=on;if(on){b.dataset.t=b.innerHTML;b.innerHTML='<span class="spin"></span><span>'+label+'</span>';}else if(b.dataset.t)b.innerHTML=b.dataset.t;}
async function doSetup(){
  const a=$('#g-pw').value,b=$('#g-pw2').value,e=$('#g-err');
  if(a.length<6){e.textContent='كلمة المرور قصيرة، استخدم 6 أحرف على الأقل.';return;}
  if(a!==b){e.textContent='كلمتا المرور غير متطابقتين.';return;}
  e.textContent='';busy(true,'جارٍ تجهيز التشفير…');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16)),pk=await deriveKey(a,salt,ITER),dek=await newDek(),rc=await makeRecoveryWrap(dek);
    key=dek;vaultMeta={salt:b64(salt),iter:ITER,wrapPw:await wrapDek(dek,pk),rsalt:rc.rsalt,riter:rc.riter,wrapRec:rc.wrapRec};newRk=rc.rk;
    state=normalizeState(pendingImport||defaultState());pendingImport=null;dirty=true;await flush();
    if(ui.saveError){throw new Error('save');}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(x){}
    enter();
  }catch(x){busy(false);state=null;key=null;e.textContent='تعذّر إنشاء الدفتر على هذا الجهاز. تأكد من تفعيل التخزين وفتح الملف في Safari.';}
}
let fails=0,lockUntil=0;
async function doUnlock(){
  const pw=$('#g-pw').value,e=$('#g-err');if(!pw)return;
  const wait=lockUntil-Date.now();if(wait>0){e.textContent=`انتظر ${Math.ceil(wait/1000)} ثانية قبل المحاولة التالية.`;return;}
  let rec;try{rec=JSON.parse(store.get(VKEY));if(!rec||!rec.ct)throw 0;}catch(x){e.textContent='بيانات الدفتر غير موجودة أو تالفة على هذا الجهاز. يمكنك استعادة نسخة احتياطية من «نسيت كلمة المرور».';return;}
  e.textContent='';busy(true,'جارٍ فتح الدفتر…');
  try{
    const k=await deriveKey(pw,unb64(rec.salt),rec.iter);let s;
    if(rec.v===2){key=await unwrapDek(rec.wrapPw,k);s=await decJSON(rec,key);vaultMeta={salt:rec.salt,iter:rec.iter,wrapPw:rec.wrapPw,rsalt:rec.rsalt,riter:rec.riter,wrapRec:rec.wrapRec};}
    else{s=await decJSON(rec,k);const dek=await newDek(),rc=await makeRecoveryWrap(dek);key=dek;vaultMeta={salt:rec.salt,iter:rec.iter,wrapPw:await wrapDek(dek,k),rsalt:rc.rsalt,riter:rc.riter,wrapRec:rc.wrapRec};newRk=rc.rk;dirty=true;}
    state=normalizeState(s);fails=0;if(dirty)await flush();enter();
  }catch(x){
    busy(false);fails++;if(fails>=5)lockUntil=Date.now()+Math.min(60,(fails-4)*10)*1000;
    e.textContent='كلمة المرور غير صحيحة.'+(fails>=5?' تمّ تأخير المحاولات قليلًا.':'');$('#g-pw').select();
  }
}

/* ================= الدخول والقفل ================= */

const OB=[['📖','دفترك الدراسي الخاص','ابدأ جلسة من الرئيسية، وسيحسب المؤقت وقتك الفعلي حتى لو انتقلت بين الصفحات. لا أرقام تلاحقك: المهم ما أنجزته واستمراريتك.'],
 ['🗂️','مواد ومهام وتقارير','أضف موادك من القائمة ⋮ واربط بها الجلسات والمهام. التقارير تُحسب من بياناتك الفعلية فقط، ولا تعرض شيئًا مضللًا.'],
 ['🔐','بياناتك عندك وحدك','مشفّرة على هذا الجهاز بكلمة مرورك. احفظ مفتاح الاسترداد الذي سيظهر لك الآن، وصدّر نسخة احتياطية بين حين وآخر.']];

  openSheet({title:'مرحبًا بك في رحلتك',body:body(),buttons:[{label:'تخطي',cls:'ghost'},{label:'التالي',cls:'primary',onClick:()=>{
    if(i<OB.length-1){i++;$('#sheet-b').innerHTML=body()+'<p class="err" id="sheet-err" role="alert"></p>';$('[data-sbtn="1"]').textContent=i===OB.length-1?'ابدأ':'التالي';return false;}}}]});

function remindCard(){
  $('#cele-root').innerHTML=`<div class="cele" role="status"><div class="cele-spark">${ic.moon}</div><div class="cele-t"><b>حان وقت رحلتك</b><span>${esc((pick('quotes')||{text:'ابدأ بما تستطيع.'}).text)}</span></div><button class="btn primary" data-act="nav" data-go="sessions">ابدأ</button><button class="icon-btn sm" data-act="cele-x" aria-label="إغلاق">${ic.x}</button></div>`;
  clearTimeout(celeT);celeT=setTimeout(()=>{$('#cele-root').innerHTML='';},20000);

function checkReminder(n){
  const s=S();if(!s.reminderOn||!/^\d\d:\d\d$/.test(s.reminderTime||''))return;
  const k=dkey(n);if(s.lastRemind===k)return;
  const [h,m]=s.reminderTime.split(':').map(Number),d=new Date(n),diff=d.getHours()*60+d.getMinutes()-(h*60+m);
  if(diff<0||diff>120)return;
  s.lastRemind=k;save();

  remindCard();
}

  const f=t=>{const x=new Date(t);return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';};

let deferredInstall=null;

function makeIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#A78BFA');g.addColorStop(1,'#5B33C9');x.fillStyle=g;x.fillRect(0,0,size,size);
  x.save();x.scale(size/64,size/64);x.strokeStyle='#fff';x.lineWidth=3;x.lineJoin='round';
  x.stroke(new Path2D('M14 22c6-3 13-3 18 1 5-4 12-4 18-1v22c-6-3-13-3-18 1-5-4-12-4-18-1z'));x.stroke(new Path2D('M32 23v22'));
  x.fillStyle='#fff';x.fill(new Path2D('M46 10l1.4 3.6L51 15l-3.6 1.4L46 20l-1.4-3.6L41 15l3.6-1.4z'));x.restore();
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  try{
    const add=(rel,href,sz)=>{const l=document.createElement('link');l.rel=rel;if(sz)l.sizes=sz;l.href=href;document.head.appendChild(l);};
    const i180=makeIcon(180),i192=makeIcon(192),i512=makeIcon(512);
    add('apple-touch-icon',i180,'180x180');add('icon',i192,'192x192');
    if(/^https?:$/.test(location.protocol)){
      const m={name:'رحلتي الدراسية',short_name:'رحلتي',lang:'ar',dir:'rtl',display:'standalone',orientation:'any',background_color:'#08060F',theme_color:'#08060F',start_url:location.pathname+location.search,scope:location.pathname.replace(/[^/]*$/,''),icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'}]};
      add('manifest',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})));
    }
  }catch(e){}
}
function installSheet(){
  const file=location.protocol==='file:',ios=isIOS();
  const steps=ios?'<li>افتح التطبيق في <b>Safari</b> (لا في متصفح آخر).</li><li>اضغط زر <b>المشاركة</b> (المربع الذي يخرج منه سهم).</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b> ثم <b>إضافة</b>.</li>'
    :'<li>من قائمة المتصفح اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</li>';
  openSheet({title:'تثبيت على الشاشة الرئيسية',body:`<ol class="pl">${steps}</ol>
   <div class="note-box" style="margin-top:10px"><b>مهم:</b> التطبيق المثبّت على iPad له تخزين منفصل عن Safari. إن أنشأت دفترك في Safari أولًا، فصدّر نسخة احتياطية ثم استوردها داخل التطبيق المثبّت، أو أنشئ دفترك مباشرة من الأيقونة.</div>
   ${file?`<div class="banner" style="margin-top:12px">${ic.info}<span>أنت تفتح التطبيق كملف محلي، وiPad لا يثبّت الملفات المحلية كأيقونة. ارفع الملف إلى استضافة مجانية بعنوان https (مثل GitHub Pages أو Netlify) ثم ثبّت ذلك العنوان.</span></div>`:''}`,
   buttons:[{label:'إغلاق',cls:'ghost'},...(deferredInstall?[{label:'تثبيت الآن',cls:'primary',onClick:async()=>{try{deferredInstall.prompt();await deferredInstall.userChoice;}catch(e){}deferredInstall=null;}}]:[])]});
}
